<div class="min-h-dvh bg-gray-100 sm:p-6">
  <div class="mx-auto max-w-7xl overflow-hidden bg-white shadow-md sm:rounded-md">
    <app-page-header title="Purchase Bill" subtitle="Enter Information for the Purchase Bill">
      <button
        class="cursor-pointer rounded-full p-1 hover:bg-white/15"
        type="button"
        title="Reset"
        aria-label="Reset"
      >
        <app-icon class="size-6" name="refresh" />
      </button>
      <button
        class="cursor-pointer rounded-full p-1 hover:bg-white/15"
        type="button"
        title="New bill"
        aria-label="New bill"
      >
        <app-icon class="size-6" name="plus-circle" />
      </button>
      <button
        class="cursor-pointer rounded-full p-1 hover:bg-white/15"
        type="button"
        title="Save bill"
        aria-label="Save bill"
      >
        <app-icon class="size-6" name="check-circle" />
      </button>
      <button
        class="cursor-pointer rounded-full p-1 hover:bg-white/15"
        type="button"
        title="Close"
        aria-label="Close"
      >
        <app-icon class="size-6" name="x-circle" />
      </button>
    </app-page-header>

    <div class="px-4 pt-3 sm:px-6">
      <app-tabs class="sm:w-fit" [tabs]="pageTabs" [(active)]="activePageTab" />
    </div>

    <div class="flex flex-col gap-4 p-4 sm:p-6 lg:flex-row lg:items-start">
      <section
        class="min-w-0 flex-1 rounded-md border border-l-4 border-gray-200 border-l-blue-700 p-4 shadow-sm sm:p-5"
      >
        @if (activePageTab() === 'Details') {
          <app-tabs class="sm:w-fit" [tabs]="detailTabs" [(active)]="activeDetailTab" />

          @if (activeDetailTab() === 'Items') {
            <div class="min-h-64 pt-6"></div>
          } @else {
            <p class="py-16 text-center text-sm text-gray-500">
              No {{ activeDetailTab() | lowercase }} for this bill.
            </p>
          }
        } @else {
          <p class="py-16 text-center text-sm text-gray-500">
            No {{ activePageTab() | lowercase }} for this bill.
          </p>
        }
      </section>

      <app-bill-summary class="shrink-0 lg:w-72" [totalItems]="0" [totalQty]="0" />
    </div>
  </div>
</div>
