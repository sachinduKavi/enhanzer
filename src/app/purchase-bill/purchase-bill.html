<div class="min-h-dvh bg-gray-100 sm:p-6">
  <div class="mx-auto max-w-7xl overflow-hidden bg-white shadow-md sm:rounded-md">
    <app-page-header title="Purchase Bill" subtitle="Enter Information for the Purchase Bill">
      <a
        class="flex items-center gap-1.5 rounded-full px-2 py-1 text-sm font-medium hover:bg-white/15"
        routerLink="/order-list"
        title="View purchase orders"
      >
        <app-icon class="size-6" name="list" />
        Orders
      </a>
      <button
        class="cursor-pointer rounded-full p-1 hover:bg-white/15 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-transparent"
        type="button"
        title="Clear the form and unsaved items"
        aria-label="Reset"
        [disabled]="store.isSaving()"
        (click)="resetBill()"
      >
        <app-icon class="size-6" name="refresh" />
      </button>
      <button
        class="cursor-pointer rounded-full p-1 hover:bg-white/15"
        type="button"
        title="New bill"
        aria-label="New bill"
      >
        <app-icon class="size-6" name="plus-circle" />
      </button>
      <button
        class="cursor-pointer rounded-full p-1 hover:bg-white/15 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-transparent"
        type="button"
        [title]="store.totalItems() ? 'Save bill' : 'Add at least one item to save'"
        [attr.aria-label]="store.isSaving() ? 'Saving bill' : 'Save bill'"
        [disabled]="!store.canSave()"
        (click)="store.save()"
      >
        @if (store.isSaving()) {
          <span
            class="block size-6 animate-spin rounded-full border-2 border-white border-t-transparent"
            aria-hidden="true"
          ></span>
        } @else {
          <app-icon class="size-6" name="check-circle" />
        }
      </button>
      <button
        class="cursor-pointer rounded-full p-1 hover:bg-white/15"
        type="button"
        title="Log out"
        aria-label="Log out"
        (click)="logout()"
      >
        <app-icon class="size-6" name="x-circle" />
      </button>
    </app-page-header>

    <div class="px-4 pt-3 sm:px-6">
      <app-tabs class="sm:w-fit" [tabs]="pageTabs" [(active)]="activePageTab" />
    </div>

    @if (store.notice(); as notice) {
      <p
        class="mx-4 mt-4 rounded px-3 py-2 text-sm sm:mx-6"
        [class]="
          notice.type === 'success' ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-700'
        "
        [attr.role]="notice.type === 'success' ? 'status' : 'alert'"
      >
        {{ notice.message }}
      </p>
    }

    <div class="flex flex-col gap-4 p-4 sm:p-6 lg:flex-row lg:items-start">
      <section
        class="min-w-0 flex-1 rounded-md border border-l-4 border-gray-200 border-l-blue-700 p-4 shadow-sm sm:p-5"
      >
        @if (activePageTab() === 'Details') {
          <app-tabs class="sm:w-fit" [tabs]="detailTabs" [(active)]="activeDetailTab" />

          @if (activeDetailTab() === 'Items') {
            <app-item-entry-form class="block pt-6" (itemAdded)="store.add($event)" />
            <app-items-table class="mt-4" [items]="store.items()" (remove)="store.remove($event)" />
          } @else {
            <p class="py-16 text-center text-sm text-gray-500">
              No {{ activeDetailTab() | lowercase }} for this bill.
            </p>
          }
        } @else {
          <p class="py-16 text-center text-sm text-gray-500">
            No {{ activePageTab() | lowercase }} for this bill.
          </p>
        }
      </section>

      <app-bill-summary
        class="shrink-0 lg:w-72"
        [totalItems]="store.totalItems()"
        [totalQty]="store.totalQty()"
      />
    </div>
  </div>
</div>
